<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Complete Booking | MP Taxi Service</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

</head>

<body>

<header>

<div class="container">

<div class="logo">

🚖 MP TAXI SERVICE

</div>

<nav>

<a href="index.html">Home</a>

<a href="results.html">Back</a>

</nav>

</div>

</header>

<section class="booking-page">

<div class="container">

<div class="booking-card">

<h2>Complete Your Booking</h2>

<div class="booking-summary">

<p><strong>Vehicle :</strong> <span id="selectedCar"></span></p>

<p><strong>Total Fare :</strong> <span id="bookingFare"></span></p>

</div>

<div class="booking-form">

<label>Your Name</label>

<input
type="text"
id="customerName"
placeholder="Enter Full Name">

<label>Mobile Number</label>

<input
type="tel"
id="customerMobile"
placeholder="Enter Mobile Number">

<label>Pickup Address</label>

<textarea
id="pickupAddress"
placeholder="Complete Pickup Address"></textarea>

<label>Special Note</label>

<textarea
id="specialNote"
placeholder="Any special instructions (optional)"></textarea>

<button
id="confirmBooking"
class="confirm-btn">

Confirm Booking on WhatsApp

</button>

</div>

</div>

</div>

</section>
</div>

<footer>

<div class="container">

<p>

© 2025 MP Taxi Service. All Rights Reserved.

</p>

</div>

</footer>

<script src="script.js"></script>

</body>

</html>
